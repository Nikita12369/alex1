<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <link rel="stylesheet" href="style.css">
  <title>Цирковая арена</title>
</head>
<body>
  <h1>Zirkusarena</h1>
  <div id="arena">
    <div id="center">Manege</div>
    <div id="backstage">Hinterbühne</div>
    <div id="entrance">Eingang</div>
  </div>
  <h2 id="day-title">Tag 1</h2>
  <div id="tabs">
    <button id="reset-button" class="pretty-btn">Neustart</button>
  </div>

  <div id="days-container" style="margin-bottom: 20px;">
</div>

<input type="text" id="rename-input" placeholder="Neuer Tagesname">
<button class="pretty-btn" onclick="renameDay()">Umbenennen</button>

<script>
  const arena = document.getElementById('arena');
  const cx = 500, cy = 500;   // центр арены (px)
  let seatId = 1;

  const VIP_START = 30;
  const VIP_END   = 150;
  const VIP_ROWS = 4;
  const VIP_PER_ROW = 25;
  const VIP_RADII = [180, 200, 220, 240];

  const RANK_ROWS = 4;
  const RANK_PER_ROW = 25;

  const LEFT_START = 277;
  const LEFT_END   = 28;
  const LEFT_RADII = [180, 200, 220, 240];

  const RIGHT_START = 153;
  const RIGHT_END   = 263;
  const RIGHT_RADII = [180, 200, 220, 240];

  function degToRad(d) { return d * Math.PI / 180; }

  function normDeg(d) {
    d = d % 360;
    if (d < 0) d += 360;
    return d;
  }

  function sectorSpan(start, end) {
    start = normDeg(start);
    end = normDeg(end);
    let span = (end - start + 360) % 360;
    if (span === 0) span = 360;
    return span;
  }

  function drawSectorSeats(startDeg, endDeg, rows, perRow, radii, className, labelPrefix) {
    startDeg = normDeg(startDeg);
    endDeg = normDeg(endDeg);
    const span = sectorSpan(startDeg, endDeg);
    const step = span / perRow;

    for (let r = 0; r < rows; r++) {
      const radius = radii[r];
      const offset = step / 2;
      for (let i = 0; i < perRow; i++) {
        let angleDeg = startDeg + i * step + offset;
        angleDeg = normDeg(angleDeg);

        const angle = degToRad(angleDeg);
        const x = cx + radius * Math.cos(angle) - 9;
        const y = cy + radius * Math.sin(angle) - 9;

        const seat = document.createElement('div');
        seat.className = 'seat ' + className;
        seat.style.left = `${x}px`;
        seat.style.top = `${y}px`;
        seat.dataset.seatNumber = seatId;
        seat.title = `${labelPrefix} ${seatId}`;

        arena.appendChild(seat);
        seatId++;
      }
    }
  }

  function drawExactSeats(startDeg, endDeg, radii, className, labelPrefix, totalNeeded) {
    startDeg = normDeg(startDeg);
    endDeg = normDeg(endDeg);
    const span = sectorSpan(startDeg, endDeg);

    let total = 0;
    let rows = [];

    for (let r of radii) {
      const arcLength = r * (span * Math.PI / 180);
      let perRow = Math.floor(arcLength / 20);

      if (total + perRow >= totalNeeded) {
        perRow = totalNeeded - total;
      }

      rows.push({ radius: r, perRow });

      total += perRow;

      if (total >= totalNeeded) break;
    }

    rows.forEach((row, rowIndex) => {
      const offset = (span / row.perRow) / 2;
      for (let i = 0; i < row.perRow; i++) {
        let angleDeg = startDeg + (i * (span / row.perRow)) + offset;
        angleDeg = normDeg(angleDeg);

        const radian = degToRad(angleDeg);
        const x = cx + row.radius * Math.cos(radian) - 9;
        const y = cy + row.radius * Math.sin(radian) - 9;

        const seat = document.createElement("div");
        seat.className = "seat " + className;
        seat.style.left = `${x}px`;
        seat.style.top  = `${y}px`;

        seat.dataset.seatNumber = seatId;
        seat.title = `${labelPrefix} ${seatId}`;
        seatId++;
        arena.appendChild(seat);
      }
    });

    console.log("ИТОГО МЕСТ:", total);
  }

  function drawRank2Left_532() {

    const start = 100;
    const end   = 238;

    const radii = [];
    for (let r = 280; r <= 520; r += 15) {
      radii.push(r);
    }

    drawExactSeats(start, end, radii, 'rank-2', '2ранг', 532);
  }

  function drawRank2Right_532() {

    const start = 302;
    const end   = 80;

    const radii = [];
    for (let r = 280; r <= 520; r += 15) {
      radii.push(r);
    }

    drawExactSeats(start, end, radii, 'rank-2', '2ранг', 532);
  }

  function drawRank3Left_71() {

    const start = 240;
    const end   = 260;

    const radii = [];
    for (let r = 280; r <= 520; r += 15) {
      radii.push(r);
    }

    drawExactSeats(start, end, radii, 'rank-3', '3ранг', 71);
  }

  function drawRank3Right_71() {

    const start = 280;
    const end   = 300;

    const radii = [];
    for (let r = 280; r <= 520; r += 15) {
      radii.push(r);
    }
    drawExactSeats(start, end, radii, 'rank-3', '3ранг', 71);
  }

  drawSectorSeats(VIP_START, VIP_END, VIP_ROWS, VIP_PER_ROW, VIP_RADII, 'vip-seat', 'VIP');


  drawSectorSeats(LEFT_START, LEFT_END, RANK_ROWS, RANK_PER_ROW, LEFT_RADII, 'rank-1', '1ранг');

  drawSectorSeats(RIGHT_START, RIGHT_END, RANK_ROWS, RANK_PER_ROW, RIGHT_RADII, 'rank-1', '1ранг');

  drawRank2Left_532();
  drawRank2Right_532();
  drawRank3Right_71();
  drawRank3Left_71();

</script>


<script src="/socket.io/socket.io.js"></script>
<script>
const socket = io();
const seatElements = {};
let currentDayId = 1;

// Инициализация seatElements при загрузке арены
document.querySelectorAll('.seat').forEach(seat => {
  const seatNumber = parseInt(seat.dataset.seatNumber);
  seatElements[seatNumber] = seat;
});

// Обработчик клика по месту
function seatClickHandler(seatDiv, seatNumber) {
  return async () => {
    const isBooked = seatDiv.classList.contains("booked");

    // Если место занято → спросить подтверждение
    if (isBooked) {
      const confirmUnbook = confirm("Вы точно хотите снять бронь с этого места?");
      if (!confirmUnbook) return; // если нажали "Отмена"
    }

    // Блокируем повторный клик
    seatDiv.onclick = null;

    try {
      await fetch(`/api/book/${currentDayId}/${seatNumber}`, { method: 'POST' });
    } catch (err) {
      console.error(err);
      alert("Ошибка сервера");
    }

    seatDiv.onclick = seatClickHandler(seatDiv, seatNumber);
  };
}

// Загрузка мест для выбранного дня
async function loadSeatsForDay(dayId) {
  currentDayId = dayId;
  const res = await fetch(`/api/seats/${dayId}`);
  const seats = await res.json();

  Object.values(seatElements).forEach(seat => seat.classList.remove('booked'));

  seats.forEach(seat => {
    const seatDiv = seatElements[seat.seat_number];
    if (seatDiv) {
      seatDiv.classList.toggle('booked', seat.taken);
      seatDiv.onclick = seatClickHandler(seatDiv, seat.seat_number);
    }
  });
}

// WebSocket обновления
socket.on('seat-updated', ({ seatNumber, taken, dayId }) => {
  if (dayId !== currentDayId) return;
  const seat = seatElements[seatNumber];
  if (seat) seat.classList.toggle('booked', taken);
});

socket.on('seats-reset', ({ dayId }) => {
  if (dayId !== currentDayId) return;
  Object.values(seatElements).forEach(seat => seat.classList.remove('booked'));
});

// Кнопка сброса брони
document.getElementById('reset-button').onclick = async () => {
  if (confirm('Очистить все брони?')) {
    await fetch(`/api/reset/${currentDayId}`, { method: 'POST' });
  }
};

// Генерация кнопок дней (15 дней)
async function loadDayNames() {
  const res = await fetch('/api/days');
  const days = await res.json();
  const container = document.getElementById('days-container');
  container.innerHTML = '';
  days.forEach(day => {
    const btn = document.createElement('button');
    btn.className = 'pretty-btn';
    btn.textContent = day.name;
    btn.onclick = () => {
      currentDayId = day.id;
      document.getElementById('day-title').textContent = day.name;
      loadSeatsForDay(day.id);
    };
    container.appendChild(btn);
  });
}

// Переименование дня
async function renameDay() {
  const newName = document.getElementById('rename-input').value.trim();
  if (!newName) return alert('Введите название');
  await fetch(`/api/rename-day/${currentDayId}`, {
    method: 'POST',
    headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify({ name: newName })
  });
  await loadDayNames();
  document.getElementById('day-title').textContent = newName;
}

// Инициализация
document.addEventListener('DOMContentLoaded', async () => {
  await loadDayNames();       // создаём 15 кнопок дней
  await loadSeatsForDay(1);   // загружаем места для 1 дня
  socket.emit('get-seats', 1);
});
</script>


</body>
</html>
